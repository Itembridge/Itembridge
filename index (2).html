<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Item Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one phone-width column. Header, nav tabs, then one routed view: board, new offer, propose, deal room, my stuff. */
:root{
  --bg:#0c0e13;
  --surface:#141822;
  --surface-2:#1b2130;
  --line:#272f41;
  --fg:#e9ecf3;
  --muted:#9099ae;
  --accent:#8fb0ff;
  --accent-soft:rgba(143,176,255,.14);
  --accent-ink:#0b1226;
  --am:#f7a8d1;
  --mm2:#ff7a7a;
  --ok:#78dca8;
  --warn:#ffd27a;
  --err:#ff8e8e;
  --display:"Unbounded","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 16px/1.55 var(--body);
  padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view{display:flex;flex-direction:column;gap:22px;min-width:0}
section,fieldset{min-width:0}
section{display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
h1{font:600 clamp(24px,6.6vw,34px)/1.18 var(--display);letter-spacing:-.01em;text-wrap:balance}
h2{font:600 17px/1.3 var(--display);text-wrap:balance}
h3{font:600 15px/1.3 var(--body)}
.muted{color:var(--muted)}
.small{font-size:14px}

/* header + nav */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:600 15px var(--display)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:600 13px var(--body);color:var(--muted);background:transparent;border:0;padding:8px 14px;min-height:36px;cursor:pointer}
.lang button.on{background:var(--surface-2);color:var(--fg)}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.nav a{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font:500 14px var(--body)}
.nav a.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 12px/20px var(--body);text-align:center}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:600 15px var(--body);text-decoration:none;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;align-self:flex-start}
input[type=text],input[type=number],select,textarea{
  width:100%;font:400 16px/1.3 var(--body);color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;
}
input::placeholder,textarea::placeholder{color:#677089}
textarea{resize:vertical}
label.lbl{display:block;font:600 14px var(--body);margin-bottom:6px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.form{display:flex;flex-direction:column;gap:22px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{padding:0;margin-bottom:10px;font:600 14px var(--body);display:flex;align-items:center;gap:8px}
.tag{font:600 12px var(--body);padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.g-am{color:var(--am)}.g-mm{color:var(--mm2)}
.pill{font:600 12px var(--body);padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:rgba(120,220,168,.14);color:var(--ok)}
.pill.warn{background:rgba(255,210,122,.14);color:var(--warn)}
.pill.err{background:rgba(255,142,142,.14);color:var(--err)}

/* direction cards */
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dir{position:relative;display:block}
.dir input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.dir-body{display:flex;flex-direction:column;gap:4px;height:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.dir-body b{font:600 15px var(--body)}
.dir-body span{font-size:13px;color:var(--muted)}
.dir input:checked+.dir-body{border-color:var(--accent);background:var(--accent-soft)}
.dir input:focus-visible+.dir-body{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:360px){.dirs{grid-template-columns:1fr}}

/* item rows */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.item-main{display:grid;grid-template-columns:minmax(0,1fr) 64px 44px;gap:8px}
.item-extra{display:flex;flex-wrap:wrap;gap:8px}
.item-extra select{width:auto;flex:1 1 120px}
.icon-btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:400 22px/1 var(--body);cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.chip span{padding:10px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font:500 14px var(--body);background:var(--bg)}
.chip input:checked+span{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 14px var(--body);cursor:pointer}
.filters button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}

/* offers + deal */
.offer{display:flex;flex-direction:column;gap:12px}
.offer-head,.card-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.offer-head .grow{flex:1}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lines li{padding-left:14px;position:relative;overflow-wrap:anywhere}
.lines li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.swap{grid-template-columns:1fr}}
.cap{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:12px}
.msgbox{font:400 13px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.bubble{max-width:86%;padding:8px 12px;border-radius:12px;background:var(--surface-2);align-self:flex-start;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent-soft)}
.bubble small{display:block;color:var(--muted);font-size:12px}
.chatform{display:flex;gap:8px}
.chatform input{flex:1}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
.status{min-height:22px;font-size:14px}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.err{color:var(--err)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;z-index:20}
#toast.ok{border-color:var(--ok)}#toast.err{border-color:var(--err)}

/* info */
details.info{border-top:1px solid var(--line);padding:14px 0}
details.info summary{cursor:pointer;font:600 15px var(--body);list-style:none}
details.info summary::-webkit-details-marker{display:none}
details.info summary::after{content:"+";float:right;color:var(--muted)}
details.info[open] summary::after{content:"\2212"}
details.info .body{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);font:600 12px var(--display)}
.facts{margin:0;display:flex;flex-direction:column}
.facts>div{padding:12px 0;border-top:1px solid var(--line)}
.facts dt{font-weight:600}
.facts dd{margin:4px 0 0;color:var(--muted)}
.rules{list-style:none;margin:0;padding:0}
.rules li{padding:12px 0;border-top:1px solid var(--line)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      var n = cleanNick(nick.value);
      if (!giveEd.hasItems()) { status.className = "status err"; status.textContent = t("errGive"); giveEd.focusEmpty(); return; }
      if (!wantEd.hasItems()) { status.className = "status err"; status.textContent = t("errWant"); wantEd.focusEmpty(); return; }
      if (n.length < 3 || n.length > 20) { status.className = "status err"; status.textContent = t("errNick"); nick.focus(); return; }
      status.textContent = ""; status.className = "status";
      btn.disabled = true;
      save("ib-nick", n);
      var slow = setTimeout(function () { toast(t("errGeneric"), "err"); btn.disabled = false; }, 8000);
      db.collection("offers").add({
        ownerUid: me, nick: n, dir: dir, give: giveEd.getItems(), want: wantEd.getItems(),
        note: note.value.trim().slice(0, 200), status: "open", createdAt: TS()
      }).then(function () {
        clearTimeout(slow);
        toast(t("published"), "ok");
        location.hash = "board";
      }).catch(function (e) { clearTimeout(slow); btn.disabled = false; fail(e); });
    });

    view.appendChild(h("section", {}, [
      h("h2", { text: t("newH") }),
      h("div", { class: "panel form" }, [
        h("fieldset", {}, [h("legend", { text: t("dirLegend") }), dirPicker("dir", dir, setDir)]),
        h("fieldset", {}, [h("legend", {}, [h("span", { text: t("giveLegend") }), tagGive]), giveEd.el]),
        h("fieldset", {}, [h("legend", {}, [h("span", { text: t("wantLegend") }), tagWant]), wantEd.el]),
        h("div", {}, [h("label", { class: "lbl", for: "nick", text: t("nickLabel") }), nick, h("p", { class: "hint", text: t("nickHint") })]),
        h("div", {}, [h("label", { class: "lbl", for: "note", text: t("noteLabel") }), note]),
        btn, status
      ])
    ]));
  }

  /* ======== propose (start a deal from an offer) ======== */
  function viewPropose(offerId) {
    var tok = routeTok;
    view.appendChild(h("p", { class: "muted", text: t("loading") }));
    db.collection("offers").doc(offerId).get().then(function (snap) {
      if (tok !== routeTok) return;
      view.textContent = "";
      if (!snap.exists || snap.data().status !== "open") { view.appendChild(h("div", { class: "empty", text: t("offerGone") })); return; }
      var o = snap.data(); o.id = snap.id;
      var sec = h("section", {}, [h("h2", { text: t("proposeH") }), offerCard(o, { noAction: true })]);
      if (o.ownerUid === me) {
        sec.appendChild(h("div", { class: "empty", text: t("ownOffer") }));
        view.appendChild(sec);
        return;
      }
      var bGame = other(o.dir);
      var ed = Editor("pb", bGame, o.want);
      var nick = h("input", { type: "text", id: "pnick", maxlength: "30", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: t("nickPh"), value: load("ib-nick") || "" });
      var status = h("p", { class: "status", role: "status", "aria-live": "polite" });
      var btn = h("button", { type: "button", class: "btn primary", id: "send-proposal", text: t("sendProposal") });
      btn.addEventListener("click", function () {
        var n = cleanNick(nick.value);
        if (!ed.hasItems()) { status.className = "status err"; status.textContent = t("errGive"); ed.focusEmpty(); return; }
        if (n.length < 3 || n.length > 20) { status.className = "status err"; status.textContent = t("errNick"); nick.focus(); return; }
        btn.disabled = true;
        save("ib-nick", n);
        db.collection("deals").add({
          offerId: o.id, aUid: o.ownerUid, bUid: me, members: [o.ownerUid, me],
          aNick: o.nick, bNick: n, dir: o.dir, aItems: o.give, bItems: ed.getItems(),
          aContact: "", bContact: "", rev: 1, aAgreedRev: 0, bAgreedRev: 0, status: "open",
          createdAt: TS(), updatedAt: TS()
        }).then(function (ref) { location.hash = "deal/" + ref.id; })
          .catch(function (e) { btn.disabled = false; fail(e); });
      });
      sec.appendChild(h("div", { class: "panel form" }, [
        h("fieldset", {}, [h("legend", {}, [h("span", { text: t("yourItems") }), h("span", { class: "tag g-" + bGame, text: GAMES[bGame] })]),
          h("p", { class: "hint", text: t("yourItemsHint") }), ed.el]),
        h("div", {}, [h("label", { class: "lbl", for: "pnick", text: t("nickLabel") }), nick, h("p", { class: "hint", text: t("nickHint") })]),
        btn, status
      ]));
      view.appendChild(sec);
    }).catch(function (e) { if (tok === routeTok) { view.textContent = ""; view.appendChild(h("div", { class: "empty", text: t("offerGone") })); } fail(e); });
  }

  /* ======== deal room ======== */
  function bridgeMessage(d) {
    var gA = d.dir, gB = other(gA);
    var a = d.aNick + (d.aContact ? " (" + fmtContact(d.aContact) + ")" : "");
    var b = d.bNick + (d.bContact ? " (" + fmtContact(d.bContact) + ")" : "");
    var lines = [t("bmTitle") + " #" + d.id, "", t("bmPlayerA") + ": " + a, t("bmGives") + " (" + GAMES[gA] + "):"];
    (d.aItems || []).forEach(function (it) { lines.push("• " + itemText(it)); });
    lines.push("", t("bmPlayerB") + ": " + b, t("bmGives") + " (" + GAMES[gB] + "):");
    (d.bItems || []).forEach(function (it) { lines.push("• " + itemText(it)); });
    lines.push("", t("bmFooter") + BRIDGE_RBX);
    return lines.join("\n");
  }

  function viewDeal(dealId) {
    var tok = routeTok;
    var ref = db.collection("deals").doc(dealId);
    var deal = null, role = null, editing = false, editor = null, cancelArmed = false, built = false;

    var head = h("div", { class: "offer-head" });
    var cardA = h("div"), cardB = h("div");
    var agreeBox = h("div", { class: "list" });
    var doneBox = h("div");
    var contactIn = h("input", { type: "text", id: "contact", maxlength: "40", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: t("contactPh") });
    var theirContact = h("p", { class: "muted small" });
    var contactBox = h("div", { class: "panel" }, [
      h("label", { class: "lbl", for: "contact", text: t("myContact") }), contactIn,
      h("p", { class: "hint", text: t("contactHint") }), theirContact
    ]);
    var cancelBox = h("div");
    var root = h("section", {}, [
      h("h2", { text: t("dealH") }), head,
      h("div", { class: "cols" }, [cardA, cardB]),
      agreeBox, doneBox, contactBox, cancelBox
    ]);

    function myGame() { return role === "a" ? deal.dir : other(deal.dir); }
    function update(fields) {
      fields.updatedAt = TS();
      return ref.update(fields).catch(fail);
    }

    function drawHead() {
      head.textContent = "";
      var cls = deal.status === "cancelled" ? "err" : (deal.status === "reported" ? "ok" : "warn");
      head.appendChild(h("span", { class: "pill " + cls, text: t("st_" + deal.status) }));
      head.appendChild(h("span", { class: "muted small", text: "#" + deal.id }));
    }

    function drawCard(side) {
      var box = side === "a" ? cardA : cardB;
      box.textContent = "";
      var game = side === "a" ? deal.dir : other(deal.dir);
      var mine = role === side;
      var agreed = deal[side + "AgreedRev"] === deal.rev;
      var c = h("div", { class: "panel card" });
      c.appendChild(h("div", { class: "card-head" }, [
        h("b", { text: deal[side + "Nick"] }),
        h("span", { class: "tag g-" + game, text: GAMES[game] }),
        mine ? h("span", { class: "pill", text: t("you") }) : null,
        h("span", { class: "pill " + (agreed ? "ok" : ""), text: agreed ? t("agreedPill") : t("thinkingPill") })
      ]));
      if (mine && editing) {
        c.appendChild(editor.el);
        c.appendChild(h("div", { class: "row" }, [
          h("button", {
            type: "button", class: "btn sm primary", text: t("saveItems"),
            onclick: function () {
              if (!editor.hasItems()) { editor.focusEmpty(); return; }
              var f = {}; f[role + "Items"] = editor.getItems(); f.rev = deal.rev + 1; f[role + "AgreedRev"] = 0;
              editing = false; editor = null;
              update(f);
              drawCard(role);
            }
          }),
          h("button", { type: "button", class: "btn sm", text: t("cancelEdit"), onclick: function () { editing = false; editor = null; drawCard(role); drawAgree(); } })
        ]));
      } else {
        c.appendChild(linesEl(deal[side + "Items"]));
        if (mine && deal.status === "open") {
          c.appendChild(h("button", {
            type: "button", class: "btn sm", text: t("edit"),
            onclick: function () { editing = true; editor = Editor("de", myGame(), deal[role + "Items"]); drawCard(role); drawAgree(); }
          }));
        }
      }
      box.appendChild(c);
    }

    function drawAgree() {
      agreeBox.textContent = "";
      if (deal.status !== "open") return;
      var agreed = deal[role + "AgreedRev"] === deal.rev;
      var b = h("button", {
        type: "button", class: "btn " + (agreed ? "" : "primary"), id: "agree", text: agreed ? t("iRevoke") : t("iAgree"),
        onclick: function () {
          if (editing) { toast(t("saveFirst"), "err"); return; }
          var f = {}; f[role + "AgreedRev"] = agreed ? 0 : deal.rev;
          update(f);
        }
      });
      agreeBox.appendChild(b);
      agreeBox.appendChild(h("p", { class: "hint", text: t("agreeHint") }));
    }

    function drawDone() {
      doneBox.textContent = "";
      if (deal.status === "cancelled") { doneBox.appendChild(h("div", { class: "empty", text: t("cancelledNote") })); return; }
      var both = deal.aAgreedRev === deal.rev && deal.bAgreedRev === deal.rev;
      if (!both) return;
      var msg = bridgeMessage(deal);
      var link = "https://t.me/" + BRIDGE_TG + "?text=" + encodeURIComponent(msg);
      function markReported() { if (deal.status === "open") update({ status: "reported" }); }
      var msgEl = h("div", { class: "msgbox", id: "bridge-msg", text: msg });
      var status = h("p", { class: "status", role: "status", "aria-live": "polite" });
      var panel = h("div", { class: "panel list" }, [
        h("h3", { text: t("bothAgreed") }),
        h("p", { class: "muted", text: t("bothAgreedText") }),
        h("p", { class: "small", text: t("bridgeAcc") + ": " + BRIDGE_RBX }),
        msgEl,
        h("a", { class: "btn primary", href: link, target: "_blank", rel: "noopener noreferrer", text: t("reportBtn"), onclick: markReported }),
        h("button", {
          type: "button", class: "btn", text: t("copyBtn"),
          onclick: function () {
            function manual() {
              var r = document.createRange(); r.selectNodeContents(msgEl);
              var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
              status.className = "status warn"; status.textContent = t("copyManual");
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(msg).then(function () { status.className = "status ok"; status.textContent = t("copied"); markReported(); }, manual);
            } else { manual(); }
          }
        }),
        status
      ]);
      if (deal.status === "reported") panel.appendChild(h("p", { class: "status ok", text: t("reportedNote") }));
      doneBox.appendChild(panel);
    }

    function drawContacts() {
      if (document.activeElement !== contactIn) contactIn.value = deal[role + "Contact"] || "";
      var oc = deal[(role === "a" ? "b" : "a") + "Contact"];
      theirContact.textContent = oc ? t("theirContact") + ": " + fmtContact(oc) : "";
    }

    function drawCancel() {
      cancelBox.textContent = "";
      if (deal.status === "cancelled") return;
      cancelBox.appendChild(h("button", {
        type: "button", class: "btn sm danger", text: cancelArmed ? t("cancelSure") : t("cancelDeal"),
        onclick: function () {
          if (!cancelArmed) { cancelArmed = true; drawCancel(); return; }
          update({ status: "cancelled" });
        }
      }));
    }

    function drawAll() {
      drawHead();
      ["a", "b"].forEach(function (s) { if (!(editing && role === s)) drawCard(s); });
      drawAgree(); drawDone(); drawContacts(); drawCancel();
    }

    function buildOnce() {
      built = true;
      contactIn.addEventListener("change", function () {
        var f = {}; f[role + "Contact"] = contactIn.value.trim().slice(0, 40);
        update(f);
      });
      view.textContent = "";
      view.appendChild(root);
      view.appendChild(chatSection());
    }

    /* chat */
    function chatSection() {
      var list = h("div", { class: "chat", "aria-live": "polite" }, [h("p", { class: "muted small", text: t("noMsgs") })]);
      var input = h("input", { type: "text", id: "chat-in", maxlength: "300", autocomplete: "off", placeholder: t("chatPh"), "aria-label": t("chatPh") });
      var form = h("form", { class: "chatform" }, [input, h("button", { type: "submit", class: "btn primary", text: t("send") })]);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var text = input.value.trim();
        if (!text || !deal) return;
        input.value = "";
        ref.collection("messages").add({ uid: me, nick: deal[role + "Nick"], text: text.slice(0, 300), createdAt: TS() }).catch(fail);
      });
      var u = ref.collection("messages").orderBy("createdAt").limit(200).onSnapshot(function (snap) {
        if (tok !== routeTok) return;
        list.textContent = "";
        if (snap.empty) { list.appendChild(h("p", { class: "muted small", text: t("noMsgs") })); return; }
        snap.docs.forEach(function (d) {
          var m = d.data();
          list.appendChild(h("div", { class: "bubble" + (m.uid === me ? " me" : "") }, [h("small", { text: m.nick }), document.createTextNode(m.text)]));
        });
        list.scrollTop = list.scrollHeight;
      }, function () { /* no access: shown by the deal itself */ });
      unsubs.push(u);
      return h("section", {}, [h("h2", { text: t("chatH") }), h("div", { class: "panel list" }, [list, form])]);
    }

    view.appendChild(h("p", { class: "muted", text: t("loading") }));
    var unsub = ref.onSnapshot(function (snap) {
      if (tok !== routeTok) return;
      if (!snap.exists) { view.textContent = ""; view.appendChild(h("div", { class: "empty", text: t("notFound") })); return; }
      deal = snap.data(); deal.id = snap.id;
      role = deal.aUid === me ? "a" : (deal.bUid === me ? "b" : null);
      if (!role) { view.textContent = ""; view.appendChild(h("div", { class: "empty", text: t("notFound") })); return; }
      if (!built) buildOnce();
      if (deal.status !== "open") { cancelArmed = false; if (editing) { editing = false; editor = null; } }
      drawAll();
    }, function () {
      if (tok !== routeTok) return;
      view.textContent = ""; view.appendChild(h("div", { class: "empty", text: t("notFound") }));
    });
    unsubs.push(unsub);
  }

  /* ======== my stuff ======== */
  function viewMy() {
    var tok = routeTok;
    var offersBox = h("div", { class: "list" }, [h("p", { class: "muted", text: t("loading") })]);
    var dealsBox = h("div", { class: "list" });

    function drawDeals() {
      if (tok !== routeTok) return;
      dealsBox.textContent = "";
      if (!myDeals.length) { dealsBox.appendChild(h("div", { class: "empty", text: t("noMyDeals") })); return; }
      myDeals.slice().sort(function (a, b) { return tsMs(b.updatedAt) - tsMs(a.updatedAt); }).forEach(function (d) {
        var mineA = d.aUid === me;
        var who = mineA ? d.bNick : d.aNick;
        var cls = d.status === "cancelled" ? "err" : (d.status === "reported" ? "ok" : "warn");
        dealsBox.appendChild(h("div", { class: "panel offer" }, [
          h("div", { class: "offer-head" }, [
            h("b", { text: t("withWho") + " " + who }),
            h("span", { class: "pill " + cls, text: t("st_" + d.status) }),
            h("span", { class: "muted small grow", text: ago(tsMs(d.updatedAt)) })
          ]),
          h("a", { class: "btn sm", href: "#deal/" + d.id, text: t("openDeal") })
        ]));
      });
    }
    onDealsChange = drawDeals;
    drawDeals();

    view.appendChild(h("section", {}, [h("h2", { text: t("myDealsH") }), dealsBox]));
    view.appendChild(h("section", {}, [h("h2", { text: t("myH") }), offersBox]));
    view.appendChild(h("p", { class: "hint", text: t("myNote") }));

    var u = db.collection("offers").where("ownerUid", "==", me).onSnapshot(function (snap) {
      if (tok !== routeTok) return;
      offersBox.textContent = "";
      var arr = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; })
        .sort(function (a, b) { return tsMs(b.createdAt) - tsMs(a.createdAt); });
      if (!arr.length) { offersBox.appendChild(h("div", { class: "empty", text: t("noMyOffers") })); return; }
      arr.forEach(function (o) { offersBox.appendChild(offerCard(o, { manage: true })); });
    }, fail);
    unsubs.push(u);
  }

  /* ======== boot ======== */
  function start() {
    if (started) return;
    started = true;
    db.collection("deals").where("members", "array-contains", me).onSnapshot(function (snap) {
      myDeals = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
      updateBadge();
      if (onDealsChange) onDealsChange();
    }, function () { /* the badge just stays empty */ });
    window.addEventListener("hashchange", function () { route(false); });
    route(false);
  }

  function boot() {
    var saved = load("ib-lang");
    if (saved === "ru" || saved === "en") lang = saved;
    document.documentElement.lang = lang;
    buildShell();
    if (typeof firebase === "undefined") { showFatal("errNoLib"); return; }
    if (!FIREBASE_CONFIG) { showFatal("errSetup"); return; }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      db = firebase.firestore();
      try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e2) {}
    } catch (e) { showFatal("errGeneric"); return; }
    var badge = document.createElement("div");
    badge.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99;padding:4px 8px;border-radius:8px;background:#1b2130;color:#9099ae;font:11px/1.3 sans-serif;opacity:.9";
    badge.textContent = "v3 · база: проверяю…";
    document.body.appendChild(badge);
    function checkDb() {
      var done = false;
      var to = setTimeout(function () { if (!done) { done = true; badge.textContent = "v3 · база: НЕТ СВЯЗИ (таймаут)"; badge.style.color = "#ff7a7a"; } }, 10000);
      db.collection("offers").limit(1).get({ source: "server" }).then(function () {
        if (done) return; done = true; clearTimeout(to);
        badge.textContent = "v3 · база: связь есть"; badge.style.color = "#6fe39a";
      }).catch(function (e) {
        if (done) return; done = true; clearTimeout(to);
        badge.textContent = "v3 · база: ошибка " + (e && e.code ? e.code : "?"); badge.style.color = "#ff7a7a";
      });
    }
    auth.onAuthStateChanged(function (u) {
      if (u) { me = u.uid; start(); checkDb(); }
    });
    auth.signInAnonymously().catch(function () { showFatal("errAuth"); });
  }

  boot();
})();
</script>
</body>
</html>
